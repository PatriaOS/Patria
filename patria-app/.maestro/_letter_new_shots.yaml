# Light/dark screenshots of polished New letter. Not a numbered phone test.
appId: app.patria.dev
---
- runFlow:
    file: subflows/sign_in.yaml
    env:
      EXPECT_HOME: "1"
      E2E_STAY: "1"
- extendedWaitUntil:
    visible:
      id: "^home$"
    timeout: 60000
- tapOn:
    id: "home-menu"
- extendedWaitUntil:
    visible:
      id: "menu-settings"
    timeout: 10000
- tapOn:
    id: "menu-settings"
- extendedWaitUntil:
    visible:
      id: "appearance-light"
    timeout: 15000
- tapOn:
    id: "appearance-light"
- tapOn:
    point: 8%, 12%
- extendedWaitUntil:
    visible:
      id: "^home$"
    timeout: 15000
- tapOn:
    id: "vault"
- extendedWaitUntil:
    visible:
      id: "screen-vault"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "letters-entry"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "letters-entry"
- extendedWaitUntil:
    visible:
      id: "screen-letters"
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "write-letter"
    timeout: 30000
- tapOn:
    id: "write-letter"
- extendedWaitUntil:
    visible:
      id: "screen-letter-new"
    timeout: 15000
- takeScreenshot: "letter-new-light"
- tapOn:
    point: 8%, 12%
- extendedWaitUntil:
    visible:
      id: "screen-letters"
    timeout: 15000
- tapOn:
    point: 8%, 12%
- extendedWaitUntil:
    visible:
      id: "screen-vault"
    timeout: 15000
- tapOn:
    id: "^home$"
- extendedWaitUntil:
    visible:
      id: "^home$"
    timeout: 15000
- tapOn:
    id: "home-menu"
- tapOn:
    id: "menu-settings"
- extendedWaitUntil:
    visible:
      id: "appearance-dark"
    timeout: 15000
- tapOn:
    id: "appearance-dark"
- tapOn:
    point: 8%, 12%
- extendedWaitUntil:
    visible:
      id: "^home$"
    timeout: 15000
- tapOn:
    id: "vault"
- extendedWaitUntil:
    visible:
      id: "screen-vault"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "letters-entry"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "letters-entry"
- extendedWaitUntil:
    visible:
      id: "write-letter"
    timeout: 30000
- tapOn:
    id: "write-letter"
- extendedWaitUntil:
    visible:
      id: "screen-letter-new"
    timeout: 15000
- takeScreenshot: "letter-new-dark"
