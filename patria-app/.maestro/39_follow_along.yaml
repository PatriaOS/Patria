# PHONE_TESTS: 39
# AREAS: sync
# Covers starting the Sync on device A. Second-phone steps stay (manual).
# Needs a Sync schedule (e2e-setup).
appId: app.patria.dev
---
- runFlow:
    file: subflows/sign_in.yaml
- tapOn:
    id: "sync"
- extendedWaitUntil:
    visible:
      id: "screen-sync"
    timeout: 20000
- runFlow:
    when:
      visible:
        id: "hold-it-now"
    commands:
      - tapOn:
          id: "hold-it-now"
- runFlow:
    when:
      visible:
        id: "continue"
    commands:
      - tapOn:
          id: "continue"
- extendedWaitUntil:
    visible:
      id: "screen-sync-run"
    timeout: 20000
- assertVisible: "Wins"
