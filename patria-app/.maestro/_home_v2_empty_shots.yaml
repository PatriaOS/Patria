# Empty Home body cards screenshots. Not a numbered phone test.
appId: app.patria.dev
---
- runFlow:
    file: subflows/sign_in.yaml
    env:
      EXPECT_HOME: "1"
      E2E_STAY: "1"
- extendedWaitUntil:
    visible:
      id: "^home$"
    timeout: 60000
- swipe:
    direction: DOWN
- extendedWaitUntil:
    visible:
      id: "home-sync-set-up"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "home-vault-empty"
    direction: DOWN
    timeout: 20000
- takeScreenshot: "HOME-v2-empty-light"
- runFlow:
    file: subflows/open_family.yaml
- scrollUntilVisible:
    element:
      id: "appearance"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "appearance"
- extendedWaitUntil:
    visible:
      id: "appearance-light"
    timeout: 15000
- tapOn:
    id: "appearance-light"
- tapOn:
    point: 8%, 12%
- extendedWaitUntil:
    visible:
      id: "screen-family"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "appearance"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "appearance"
- extendedWaitUntil:
    visible:
      id: "appearance-dark"
    timeout: 15000
- tapOn:
    id: "appearance-dark"
- tapOn:
    point: 8%, 12%
- tapOn:
    id: "^home$"
- extendedWaitUntil:
    visible:
      id: "home-sync-set-up"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "home-vault-empty"
    direction: DOWN
    timeout: 20000
- takeScreenshot: "HOME-v2-empty-dark"
