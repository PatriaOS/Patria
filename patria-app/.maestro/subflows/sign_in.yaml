appId: app.patria.dev
---
- launchApp
- runFlow:
    file: dismiss_open_in.yaml
- tapOn:
    text: "Dismiss"
    optional: true
- tapOn:
    text: "Reload"
    optional: true
# Do not wait for copy "Just a moment…" to vanish globally — Home cards reuse that
# string while loading, which hangs this step after Home is already up (Maestro then
# loses the XCTest driver). Wait for a real screen or the font splash instead.
- extendedWaitUntil:
    visible:
      id: "^home$|^screen-welcome$|^screen-sign-in$|^screen-sign-up$|^screen-create-family$|^screen-waiting-own-phone$|font-gate-splash|recovery-reminder-sheet"
    timeout: 60000
- runFlow:
    when:
      visible:
        id: "font-gate-splash"
    commands:
      - extendedWaitUntil:
          notVisible:
            id: "font-gate-splash"
          timeout: 60000
- runFlow:
    when:
      visible: "Loading from Metro..."
    commands:
      - extendedWaitUntil:
          notVisible: "Loading from Metro..."
          timeout: 120000
# If a prior session left Home under the reminder Modal, Maestro cannot see
# id home and sign_in_form never signs out. Brief optional dismiss first.
- extendedWaitUntil:
    visible:
      id: "recovery-reminder-later"
    timeout: 3000
    optional: true
- runFlow:
    file: dismiss_recovery_reminder.yaml
- runFlow:
    when:
      visible:
        id: "^screen-sign-up$"
    commands:
      - tapOn:
          id: "^already-have-an-account-sign-in$"
      - extendedWaitUntil:
          visible:
            id: "^screen-sign-in$"
          timeout: 20000
- runFlow:
    file: sign_in_form.yaml
- tapOn:
    text: "Not Now"
    optional: true
- runFlow:
    when:
      true: ${EXPECT_HOME == '0'}
    commands:
      # Create / join paths: never wait for the recovery reminder after sign-in.
      - extendedWaitUntil:
          visible:
            id: "^screen-create-family$|^home$"
          timeout: 45000
      - runFlow:
          when:
            visible: "Create a family space"
          commands:
            - tapOn: "Create our family"
            - extendedWaitUntil:
                visible:
                  id: "screen-create-family"
                timeout: 20000
- runFlow:
    when:
      true: ${EXPECT_HOME != '0'}
    commands:
      # Reminder can appear after Home paints. Wait for either, dismiss sheet, then require
      # home/waiting (sheet covers home so id home alone races).
      - extendedWaitUntil:
          visible:
            id: "^home$|^screen-waiting-own-phone$|recovery-reminder-sheet"
          timeout: 45000
      - runFlow:
          file: dismiss_recovery_reminder.yaml
      - extendedWaitUntil:
          visible:
            id: "recovery-reminder-sheet"
          timeout: 3000
          optional: true
      - runFlow:
          file: dismiss_recovery_reminder.yaml
      - extendedWaitUntil:
          visible:
            id: "^home$|^screen-waiting-own-phone$"
          timeout: 45000
