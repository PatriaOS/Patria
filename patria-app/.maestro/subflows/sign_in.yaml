appId: app.patria.dev
---
- launchApp
- runFlow:
    file: dismiss_open_in.yaml
- tapOn:
    text: "Dismiss"
    optional: true
- tapOn:
    text: "Reload"
    optional: true
- extendedWaitUntil:
    notVisible: "Just a moment…"
    timeout: 30000
- runFlow:
    when:
      visible: "Loading from Metro..."
    commands:
      - extendedWaitUntil:
          notVisible: "Loading from Metro..."
          timeout: 120000
# If a prior session left Home under the reminder Modal, Maestro cannot see
# id home and sign_in_form never signs out. Brief optional dismiss first.
- extendedWaitUntil:
    visible:
      id: "recovery-reminder-later"
    timeout: 3000
    optional: true
- runFlow:
    file: dismiss_recovery_reminder.yaml
- runFlow:
    when:
      visible:
        id: "^screen-sign-up$"
    commands:
      - tapOn:
          id: "^already-have-an-account-sign-in$"
      - extendedWaitUntil:
          visible:
            id: "^screen-sign-in$"
          timeout: 20000
- runFlow:
    file: sign_in_form.yaml
- tapOn:
    text: "Not Now"
    optional: true
- runFlow:
    when:
      true: ${EXPECT_HOME == '0'}
    commands:
      # Create / join paths: never wait for the recovery reminder after sign-in.
      - extendedWaitUntil:
          visible:
            id: "^screen-create-family$|^home$"
          timeout: 45000
      - runFlow:
          when:
            visible: "Create a family space"
          commands:
            - tapOn: "Create our family"
            - extendedWaitUntil:
                visible:
                  id: "screen-create-family"
                timeout: 20000
- runFlow:
    when:
      true: ${EXPECT_HOME != '0'}
    commands:
      # Reminder after this sign-in: short optional wait (waiting phones never see it).
      - extendedWaitUntil:
          visible:
            id: "recovery-reminder-later"
          timeout: 8000
          optional: true
      - runFlow:
          file: dismiss_recovery_reminder.yaml
      - extendedWaitUntil:
          visible:
            id: "^home$|^screen-waiting-own-phone$"
          timeout: 45000
