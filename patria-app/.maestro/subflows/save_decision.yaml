appId: app.patria.dev
---
- tapOn:
    id: "the-decision"
- inputText: ${DECISION_TITLE}
- pressKey: Enter
- runFlow:
    when:
      true: ${DECISION_FOR != ''}
    commands:
      - inputText: ${DECISION_FOR}
      - pressKey: Enter
- tapOn:
    id: "why"
- inputText: ${DECISION_WHY}
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      id: "save"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "save"
- extendedWaitUntil:
    notVisible:
      id: "the-decision"
    timeout: 45000
