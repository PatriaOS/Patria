# PHONE_TESTS: 65
# AREAS: letters, navigation
# Test 2 saves a birthday in Profile so age letters can be sealed to them.
appId: app.patria.dev
---
- runFlow:
    file: subflows/sign_in.yaml
- tapOn:
    id: "home-menu"
- extendedWaitUntil:
    visible:
      id: "menu-profile"
    timeout: 10000
- tapOn:
    id: "menu-profile"
- extendedWaitUntil:
    visible:
      id: "screen-profile"
    timeout: 15000
- assertVisible: "Your birthday stays private. Only you and family admins can see it. Letters that open on an age use it on the server. The writer never sees the date."
- tapOn:
    id: "profile-birthday"
- extendedWaitUntil:
    visible:
      id: "profile-birthday-sheet"
    timeout: 10000
- assertVisible:
    id: "profile-birthday-clear"
- tapOn:
    id: "profile-birthday-e2e-young"
- tapOn:
    id: "profile-birthday-done"
- extendedWaitUntil:
    visible:
      id: "profile-birthday"
      text: "Birthday: June 15, 2015"
    timeout: 10000
- tapOn:
    id: "profile-save"
- extendedWaitUntil:
    visible: "Saved."
    timeout: 15000
- assertVisible:
    id: "screen-profile"
