# PHONE_TESTS: 65
# AREAS: letters, navigation
# Test 2 saves a birthday via the date wheel (default past day).
appId: app.patria.dev
---
- runFlow:
    file: subflows/sign_in.yaml
- tapOn:
    id: "home-menu"
- extendedWaitUntil:
    visible:
      id: "menu-profile"
    timeout: 10000
- tapOn:
    id: "menu-profile"
- extendedWaitUntil:
    visible:
      id: "screen-profile"
    timeout: 15000
- assertVisible: "Your birthday stays private. Only you and family admins can see it. Letters that open on an age use it on the server. The writer never sees the date."
- runFlow:
    file: subflows/set_profile_birthday_default.yaml
    env:
      CLEAR: "1"
      BIRTHDAY_PREVIEW: ${BIRTHDAY_PREVIEW}
      BIRTHDAY_LABEL: ${BIRTHDAY_LABEL}
- tapOn:
    id: "profile-save"
- extendedWaitUntil:
    visible: "Saved."
    timeout: 15000
- assertVisible:
    id: "screen-profile"
