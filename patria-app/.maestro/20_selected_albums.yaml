# PHONE_TESTS: 20
# AREAS: memories
appId: app.patria.dev
---
- launchApp:
    permissions:
      photos: allow
- runFlow:
    file: subflows/sign_in.yaml
- tapOn:
    id: "memories"
- extendedWaitUntil:
    visible:
      id: "screen-memories"
    timeout: 20000
- tapOn:
    id: "connect-my-photos"
- tapOn:
    id: "connect-continue"
- extendedWaitUntil:
    visible:
      id: "mode-albums"
    timeout: 20000
- assertVisible:
    id: "mode-all"
