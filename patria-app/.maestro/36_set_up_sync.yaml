# PHONE_TESTS: 36
# AREAS: sync, navigation
appId: app.patria.dev
---
- runFlow:
    when:
      true: ${PHASE == 'set_up'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - tapOn:
          id: "sync"
      - extendedWaitUntil:
          visible:
            id: "screen-sync"
          timeout: 20000
      - assertVisible: "Family Sync"
      - tapOn:
          id: "set-up-our-sync"
      - extendedWaitUntil:
          visible:
            id: "screen-sync-schedule"
          timeout: 15000
      - assertVisible:
          id: "weekday-sun"
      - assertVisible: "Household"
      - assertVisible: "Extended Family"
      - tapOn:
          id: "weekday-sun"
      - tapOn:
          id: "time"
      - eraseText: 20
      - inputText: "19:00"
      - pressKey: Enter
      - scrollUntilVisible:
          element:
            id: "save-schedule"
          direction: DOWN
          timeout: 20000
      - tapOn:
          id: "save-schedule"
      - extendedWaitUntil:
          visible:
            id: "screen-sync"
          timeout: 30000
      - extendedWaitUntil:
          visible:
            id: "sync-tonight-flow"
          timeout: 15000
      # Flow sits below RSVP on the hub; scroll until the Wins step is on screen.
      - scrollUntilVisible:
          element:
            id: "sync-flow-step-wins"
          direction: DOWN
          timeout: 20000
      - assertVisible: "Wins"
      - assertVisible: "Look ahead"
      - assertVisible: "Decide"
      - assertVisible: "Gratitude"
- runFlow:
    when:
      true: ${PHASE == 'member_sees_schedule'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - tapOn:
          id: "sync"
      - extendedWaitUntil:
          visible:
            id: "screen-sync"
          timeout: 20000
      - assertVisible: "Family Sync"
      - assertVisible: "Wins"
      - assertNotVisible:
          id: "schedule"
