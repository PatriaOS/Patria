# PHONE_TESTS: 12
# AREAS: recovery, devices
# Do not screenshot the printed-code field. Words stay in clipboard / Maestro memory only.
# Core path: clear old phone → start recovery → wait → two helpers Help → finish with no paper.
appId: app.patria.dev
---
- runFlow:
    when:
      true: ${PHASE == 'start'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - runFlow:
          file: subflows/open_family.yaml
      - scrollUntilVisible:
          element:
            id: "^i-lost-my-phone$"
          direction: DOWN
          timeout: 30000
      - tapOn:
          id: "^i-lost-my-phone$"
      - extendedWaitUntil:
          visible:
            id: "start-recovery"
          timeout: 20000
      - tapOn:
          id: "start-recovery"
      - extendedWaitUntil:
          visible:
            id: "recovery-waiting-until"
          timeout: 30000
      - assertVisible:
          id: "recovery-waiting-until"
- runFlow:
    when:
      true: ${PHASE == 'waiting_copy'}
    commands:
      # After clear_state + start, a fresh sign-in lands on Home (let-in wait),
      # not the recover screen — open I lost my phone again.
      # Local recovery_wait is seconds, so by this phase the UI may already show
      # Finish (helper count) instead of "Waiting until …".
      - runFlow:
          file: subflows/sign_in.yaml
      - runFlow:
          file: subflows/open_family.yaml
      - scrollUntilVisible:
          element:
            id: "^i-lost-my-phone$"
          direction: DOWN
          timeout: 30000
      - tapOn:
          id: "^i-lost-my-phone$"
      - extendedWaitUntil:
          visible:
            id: "^(recovery-waiting-until|recovery-helper-count|finish-recovery)$"
          timeout: 30000
      - assertVisible:
          id: "^(recovery-waiting-until|recovery-helper-count|finish-recovery)$"
- runFlow:
    when:
      true: ${PHASE == 'old_phone_alert'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - runFlow:
          file: subflows/open_family.yaml
      - swipe:
          start: 50%, 25%
          end: 50%, 80%
      - scrollUntilVisible:
          element:
            id: "^this-wasnt-me$"
          direction: DOWN
          timeout: 20000
      - assertVisible:
          id: "^this-wasnt-me$"
- runFlow:
    when:
      true: ${PHASE == 'cancel_not_me'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - runFlow:
          file: subflows/open_family.yaml
      - swipe:
          start: 50%, 25%
          end: 50%, 80%
      - scrollUntilVisible:
          element:
            id: "^this-wasnt-me$"
          direction: DOWN
          timeout: 20000
      - tapOn:
          id: "^this-wasnt-me$"
- runFlow:
    when:
      true: ${PHASE == 'restart_after_cancel'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - runFlow:
          file: subflows/open_family.yaml
      - scrollUntilVisible:
          element:
            id: "^i-lost-my-phone$"
          direction: DOWN
          timeout: 30000
      - tapOn:
          id: "^i-lost-my-phone$"
      - extendedWaitUntil:
          visible:
            id: "^(start-recovery|recovery-waiting-until)$"
          timeout: 30000
      - runFlow:
          when:
            visible:
              id: "start-recovery"
          commands:
            - tapOn:
                id: "start-recovery"
      - extendedWaitUntil:
          visible:
            id: "^(recovery-waiting-until|recovery-helper-count|finish-recovery)$"
          timeout: 30000
- runFlow:
    when:
      true: ${PHASE == 'cancelled_by_you'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - assertVisible: "Cancelled by you"
- runFlow:
    when:
      true: ${PHASE == 'one_helper_not_enough'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - runFlow:
          when:
            notVisible:
              id: "finish-recovery"
          commands:
            - runFlow:
                file: subflows/open_family.yaml
            - scrollUntilVisible:
                element:
                  id: "^i-lost-my-phone$"
                direction: DOWN
                timeout: 30000
            - tapOn:
                id: "^i-lost-my-phone$"
      - extendedWaitUntil:
          visible:
            id: "finish-recovery"
          timeout: 45000
      - assertVisible:
          id: "recovery-helper-count"
      - assertNotVisible:
          id: "printed-code-both-helped"
      - tapOn:
          id: "finish-recovery"
      - extendedWaitUntil:
          visible: "We couldn’t finish recovery"
          timeout: 30000
      - assertNotVisible: "Remove your old phones"
- runFlow:
    when:
      true: ${PHASE == 'admin_alert'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - runFlow:
          file: subflows/open_family.yaml
      - swipe:
          start: 50%, 25%
          end: 50%, 80%
      - scrollUntilVisible:
          element:
            id: "^stop-this-recovery$"
          direction: DOWN
          timeout: 20000
      - assertVisible:
          id: "^stop-this-recovery$"
- runFlow:
    when:
      true: ${PHASE == 'admin_stop'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - runFlow:
          file: subflows/open_family.yaml
      - swipe:
          start: 50%, 25%
          end: 50%, 80%
      - scrollUntilVisible:
          element:
            id: "^stop-this-recovery$"
          direction: DOWN
          timeout: 20000
      - tapOn:
          id: "^stop-this-recovery$"
- runFlow:
    when:
      true: ${PHASE == 'cancelled_by_admin'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - assertVisible: "Cancelled by a family admin"
- runFlow:
    when:
      true: ${PHASE == 'approve_help'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - runFlow:
          file: subflows/open_family.yaml
      - swipe:
          start: 50%, 25%
          end: 50%, 80%
      - scrollUntilVisible:
          element:
            id: "^help-with-recovery$"
          direction: DOWN
          timeout: 30000
      - takeScreenshot: recovery-helper-help
      - tapOn:
          id: "^help-with-recovery$"
- runFlow:
    when:
      true: ${PHASE == 'finish_two_helpers'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      # After clear_state, Home may show let-in wait — open lost-phone to resume the request.
      - runFlow:
          when:
            notVisible:
              id: "finish-recovery"
          commands:
            - runFlow:
                file: subflows/open_family.yaml
            - scrollUntilVisible:
                element:
                  id: "^i-lost-my-phone$"
                direction: DOWN
                timeout: 30000
            - tapOn:
                id: "^i-lost-my-phone$"
      - extendedWaitUntil:
          visible:
            id: "finish-recovery"
          timeout: 45000
      - assertVisible:
          id: "recovery-helper-count"
      - takeScreenshot: recovery-finish-two-helpers
      - tapOn:
          id: "finish-recovery"
      - extendedWaitUntil:
          visible: "Remove your old phones"
          timeout: 60000
- runFlow:
    when:
      true: ${PHASE == 'finish_paper'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - scrollUntilVisible:
          element:
            id: "^printed-code-24-words$"
          direction: DOWN
          timeout: 20000
      - tapOn:
          id: "^printed-code-24-words$"
      - eraseText
      - pasteText
      - tapOn:
          id: "^finish-recovery$"
      - extendedWaitUntil:
          visible: "Remove your old phones"
          timeout: 30000
- runFlow:
    when:
      true: ${PHASE == 'remove_old'}
    commands:
      - launchApp:
          appId: app.patria.dev
          stopApp: false
      - extendedWaitUntil:
          visible: "Remove your old phones"
          timeout: 15000
      - tapOn:
          id: "^remove-listed-phones$"
      - assertNotVisible:
          id: "printed-code-words"
- runFlow:
    when:
      true: ${PHASE == 'keys_ready'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - runFlow:
          file: subflows/open_family.yaml
      - scrollUntilVisible:
          element: "Family keys: set up on this phone"
          direction: DOWN
          timeout: 30000
      - assertVisible: "Family keys: set up on this phone"
      - takeScreenshot: recovery-keys-ready-after-lost-phone
