# Local/e2e design route — recovery status review captures. No printed words.
appId: app.patria.dev
---
- openLink: patria://design-recovery?shot=needs_attention
- extendedWaitUntil:
    visible:
      id: "design-recovery-needs-attention"
    timeout: 20000
- takeScreenshot: recovery-needs-attention
- openLink: patria://design-recovery?shot=printed_need_ab
- extendedWaitUntil:
    visible:
      id: "design-recovery-printed-need-ab"
    timeout: 20000
- takeScreenshot: recovery-printed-need-ab
- openLink: patria://design-recovery?shot=printed_after_repair
- extendedWaitUntil:
    visible:
      id: "design-recovery-printed-after-repair"
    timeout: 20000
- takeScreenshot: recovery-printed-after-repair
