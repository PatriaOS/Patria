# PHONE_TESTS: 30
# AREAS: vault, rotation, keys
appId: app.patria.dev
---
- runFlow:
    when:
      true: ${PHASE == 'write'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - tapOn:
          id: "vault"
      - extendedWaitUntil:
          visible:
            id: "screen-vault"
          timeout: 20000
      - tapOn:
          id: "new-decision"
      - runFlow:
          file: subflows/save_decision.yaml
          env:
            DECISION_TITLE: "We moved"
            DECISION_FOR: ""
            DECISION_WHY: "For school."
      - extendedWaitUntil:
          visible:
            id: "we-moved"
          timeout: 20000
- runFlow:
    when:
      true: ${PHASE == 'remove_and_read'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - runFlow:
          file: subflows/open_family.yaml
      - scrollUntilVisible:
          element:
            id: "member-test-3"
          direction: DOWN
          timeout: 20000
      - tapOn:
          id: "member-test-3"
      - tapOn:
          id: "^remove-from-this-family$"
      - tapOn:
          text: "Remove from this family"
          index: 1
      - extendedWaitUntil:
          visible: "The family key is up to date"
          timeout: 30000
      - tapOn:
          id: "vault"
      - extendedWaitUntil:
          visible:
            id: "screen-vault"
          timeout: 20000
      - tapOn:
          id: "we-moved"
      - extendedWaitUntil:
          visible: "For school."
          timeout: 15000
