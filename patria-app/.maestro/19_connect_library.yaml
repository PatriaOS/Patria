# PHONE_TESTS: 19
# AREAS: memories
appId: app.patria.dev
---
- runFlow:
    when:
      true: ${PHASE == 'connect'}
    commands:
      - launchApp:
          permissions:
            photos: allow
      - runFlow:
          file: subflows/sign_in.yaml
      - tapOn:
          id: "memories"
      - extendedWaitUntil:
          visible:
            id: "screen-memories"
          timeout: 20000
      - tapOn:
          id: "connect-my-photos"
      - extendedWaitUntil:
          visible:
            id: "screen-memories-connect"
          timeout: 20000
      - assertVisible:
          id: "connect-explainer"
      - tapOn:
          id: "connect-continue"
      - extendedWaitUntil:
          visible:
            id: "turn-on-sharing"
          timeout: 20000
      - assertVisible:
          id: "step-what"
      - assertVisible:
          id: "step-who"
      - assertVisible:
          id: "photo-access-full"
      - assertNotVisible:
          id: "open-settings"
      - assertVisible:
          id: "choose-who"
      - tapOn:
          id: "turn-on-sharing"
      - assertVisible:
          id: "choose-who"
      - assertVisible:
          id: "screen-memories-connect-settings"
      - tapOn:
          id: "connect-circle-household"
      - extendedWaitUntil:
          visible:
            id: "connect-circle-household-selected"
          timeout: 10000
      - tapOn:
          id: "start-today"
      - tapOn:
          id: "turn-on-sharing"
      - extendedWaitUntil:
          visible:
            id: "screen-memories"
          timeout: 20000
      - assertVisible:
          id: "library-status"
      - tapOn:
          text: "Share them"
          optional: true
- runFlow:
    when:
      true: ${PHASE == 'new_photo'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - tapOn:
          id: "memories"
      - extendedWaitUntil:
          visible:
            id: "screen-memories"
          timeout: 20000
      - tapOn:
          text: "Share them"
          optional: true
      - swipe:
          start: 50%, 25%
          end: 50%, 80%
      - extendedWaitUntil:
          visible: "Added automatically"
          timeout: 45000
- runFlow:
    when:
      true: ${PHASE == 'see_auto'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - tapOn:
          id: "memories"
      - extendedWaitUntil:
          visible:
            id: "screen-memories"
          timeout: 20000
      - swipe:
          start: 50%, 25%
          end: 50%, 80%
      - extendedWaitUntil:
          visible: "Added automatically"
          timeout: 20000
