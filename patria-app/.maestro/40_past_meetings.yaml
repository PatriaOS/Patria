# PHONE_TESTS: 40
# AREAS: sync
# STUB (GOV02 slice 1): written from PHONE_TESTS.md test 40; not yet run on a phone.
appId: app.patria.dev
---
- runFlow:
    file: subflows/sign_in.yaml
- tapOn:
    id: "sync"
- extendedWaitUntil:
    visible:
      id: "screen-sync"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "past-meetings"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "past-meetings"
- extendedWaitUntil:
    visible:
      id: "screen-sync-past"
    timeout: 15000
- assertVisible: "Summary"
