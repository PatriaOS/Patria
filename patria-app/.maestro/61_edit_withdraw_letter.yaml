# PHONE_TESTS: 61
# AREAS: letters
# PHASE=edit: seal, edit, reseal with a new seal code.
# PHASE=withdraw: withdraw, confirm, list empty.
# PHASE=recipient_gone: Test 2 never sees the letter.
appId: app.patria.dev
---
- runFlow:
    when:
      true: ${PHASE == null || PHASE == '' || PHASE == 'edit'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - tapOn:
          id: "vault"
      - extendedWaitUntil:
          visible:
            id: "screen-vault"
          timeout: 20000
      - scrollUntilVisible:
          element:
            id: "letters-entry"
          direction: DOWN
          timeout: 15000
      - tapOn:
          id: "letters-entry"
      - extendedWaitUntil:
          visible:
            id: "screen-letters"
          timeout: 20000
      - extendedWaitUntil:
          visible:
            id: "write-letter"
          timeout: 30000
      - tapOn:
          id: "write-letter"
      - extendedWaitUntil:
          visible:
            id: "screen-letter-new"
          timeout: 15000
      - extendedWaitUntil:
          visible: "Test 2"
          timeout: 30000
      - tapOn:
          id: "letter-from"
      - eraseText
      - inputText: "Test 1"
      - tapOn: "Who is this for?"
      - tapOn:
          id: "letter-body"
      - inputText: "A letter to edit and withdraw."
      - tapOn: "Who is this for?"
      - scrollUntilVisible:
          element:
            id: "letter-date-1y"
          direction: DOWN
          timeout: 10000
      - tapOn:
          id: "letter-date-1y"
      - scrollUntilVisible:
          element:
            id: "seal-letter"
          direction: DOWN
          timeout: 10000
      - tapOn:
          id: "seal-letter"
      - extendedWaitUntil:
          visible:
            id: "screen-letter-sealed"
          timeout: 45000
      - extendedWaitUntil:
          visible:
            id: "letter-seal-code"
          timeout: 10000
      - copyTextFrom:
          id: "letter-seal-code"
      - evalScript: ${output.originalSealCode = (maestro.copiedText || '').replace(/^.*:\s*/, '').trim()}
      - tapOn:
          id: "letter-sealed-done"
      - extendedWaitUntil:
          visible:
            id: "screen-letters"
          timeout: 15000
      - assertVisible:
          text: "For Test 2\\. Opens .*"
      - tapOn:
          text: "For Test 2.*"
      - extendedWaitUntil:
          visible:
            id: "edit-letter"
          timeout: 15000
      - tapOn:
          id: "edit-letter"
      - extendedWaitUntil:
          visible:
            id: "screen-letter-new"
          timeout: 15000
      - assertVisible: "Edit letter"
      - assertVisible: "A letter to edit and withdraw."
      # Seal with no edits: version and seal code must stay the same.
      - scrollUntilVisible:
          element:
            id: "seal-letter"
          direction: DOWN
          timeout: 10000
      - tapOn:
          id: "seal-letter"
      - extendedWaitUntil:
          visible:
            id: "screen-letter-sealed"
          timeout: 20000
      - assertVisible:
          id: "letter-unchanged-kept"
      - assertNotVisible: "Your seal code changed"
      - assertVisible:
          text: ".*${output.originalSealCode}.*"
      - tapOn:
          id: "letter-sealed-done"
      - extendedWaitUntil:
          visible:
            id: "screen-letters"
          timeout: 15000
      - tapOn:
          text: "For Test 2.*"
      - extendedWaitUntil:
          visible:
            id: "edit-letter"
          timeout: 15000
      - tapOn:
          id: "edit-letter"
      - extendedWaitUntil:
          visible:
            id: "screen-letter-new"
          timeout: 15000
      - assertVisible: "A letter to edit and withdraw."
      - tapOn:
          id: "letter-body"
      - eraseText
      - inputText: "Edited letter body."
      - tapOn: "Who is this for?"
      - scrollUntilVisible:
          element:
            id: "seal-letter"
          direction: DOWN
          timeout: 10000
      - tapOn:
          id: "seal-letter"
      - extendedWaitUntil:
          visible:
            id: "screen-letter-sealed"
          timeout: 45000
      - assertVisible: "Your seal code changed"
      - assertVisible: "Edit letter"
      - extendedWaitUntil:
          visible:
            id: "letter-seal-code"
          timeout: 10000
      - copyTextFrom:
          id: "letter-seal-code"
      - evalScript: ${output.editSealCode = (maestro.copiedText || '').replace(/^.*:\s*/, '').trim()}
      - takeScreenshot: b0-seal-code-changed
      - tapOn:
          id: "letter-sealed-done"
      - extendedWaitUntil:
          visible:
            id: "screen-letters"
          timeout: 15000
      - tapOn:
          text: "For Test 2.*"
      - extendedWaitUntil:
          visible:
            id: "screen-letter-detail"
          timeout: 15000
      - assertVisible:
          id: "fingerprint-${output.editSealCode}"
      - assertVisible:
          text: ".*${output.editSealCode}.*"
- runFlow:
    when:
      true: ${PHASE == 'withdraw'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - tapOn:
          id: "vault"
      - extendedWaitUntil:
          visible:
            id: "screen-vault"
          timeout: 20000
      - scrollUntilVisible:
          element:
            id: "letters-entry"
          direction: DOWN
          timeout: 15000
      - tapOn:
          id: "letters-entry"
      - extendedWaitUntil:
          visible:
            id: "screen-letters"
          timeout: 20000
      - tapOn:
          text: "For Test 2.*"
      - extendedWaitUntil:
          visible:
            id: "withdraw-letter"
          timeout: 15000
      - tapOn:
          id: "withdraw-letter"
      - extendedWaitUntil:
          visible:
            id: "withdraw-letter-confirm-yes"
          timeout: 10000
      - tapOn:
          id: "withdraw-letter-confirm-yes"
      - extendedWaitUntil:
          visible:
            id: "screen-letters"
          timeout: 30000
      - assertVisible: "No letters yet"
- runFlow:
    when:
      true: ${PHASE == 'recipient_gone'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - tapOn:
          id: "vault"
      - extendedWaitUntil:
          visible:
            id: "screen-vault"
          timeout: 20000
      - scrollUntilVisible:
          element:
            id: "letters-entry"
          direction: DOWN
          timeout: 15000
      - tapOn:
          id: "letters-entry"
      - extendedWaitUntil:
          visible:
            id: "screen-letters"
          timeout: 20000
      - assertVisible: "No letters yet"
      - assertNotVisible: "A letter from Test 1"
      - assertNotVisible: "Edited letter body."
      - assertNotVisible:
          id: "open-letter"
