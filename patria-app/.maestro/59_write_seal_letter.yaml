# PHONE_TESTS: 59
# AREAS: letters, vault, keys
# Surprise is the default visibility — keep it without tapping.
appId: app.patria.dev
---
- runFlow:
    file: subflows/sign_in.yaml
- tapOn:
    id: "vault"
- extendedWaitUntil:
    visible:
      id: "screen-vault"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "letters-entry"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "letters-entry"
- extendedWaitUntil:
    visible:
      id: "screen-letters"
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "write-letter"
    timeout: 30000
- tapOn:
    id: "write-letter"
- extendedWaitUntil:
    visible:
      id: "screen-letter-new"
    timeout: 15000
- tapOn:
    id: "letter-body"
- inputText: "A letter for your future self."
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "letter-record-voice"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "letter-record-voice"
- extendedWaitUntil:
    visible: "0:20"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "letter-date-1y"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "letter-date-1y"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "seal-letter"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "seal-letter"
- extendedWaitUntil:
    visible:
      id: "screen-letter-sealed"
    timeout: 30000
- assertVisible: "Your letter is sealed"
- extendedWaitUntil:
    visible:
      id: "letter-seal-code"
    timeout: 10000
- tapOn:
    id: "letter-sealed-done"
- extendedWaitUntil:
    visible:
      id: "screen-letters"
    timeout: 15000
