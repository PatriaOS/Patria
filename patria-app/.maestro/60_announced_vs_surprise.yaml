# PHONE_TESTS: 60
# AREAS: letters
# PHASE=author: seal Surprise then Announced (tests are isolated; no 59 state).
# PHASE=recipient_list: Test 2 sees announced From + open date; no surprise.
# PHASE=recipient_stub: announced opens as waiting stub; body stays hidden.
appId: app.patria.dev
---
- runFlow:
    when:
      true: ${PHASE == null || PHASE == '' || PHASE == 'author'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - tapOn:
          id: "vault"
      - extendedWaitUntil:
          visible:
            id: "screen-vault"
          timeout: 20000
      - scrollUntilVisible:
          element:
            id: "letters-entry"
          direction: DOWN
          timeout: 15000
      - tapOn:
          id: "letters-entry"
      - extendedWaitUntil:
          visible:
            id: "screen-letters"
          timeout: 20000
      - extendedWaitUntil:
          visible:
            id: "write-letter"
          timeout: 20000
      # Surprise first (default visibility) so the recipient must not see it.
      - tapOn:
          id: "write-letter"
      - extendedWaitUntil:
          visible:
            id: "screen-letter-new"
          timeout: 15000
      - extendedWaitUntil:
          visible: "Test 2"
          timeout: 30000
      - tapOn:
          id: "letter-from"
      - eraseText
      - inputText: "Test 1"
      - tapOn: "Who is this for?"
      - tapOn:
          id: "letter-body"
      - inputText: "A surprise letter they must not see yet."
      - tapOn: "Who is this for?"
      - scrollUntilVisible:
          element:
            id: "letter-date-1y"
          direction: DOWN
          timeout: 10000
      - tapOn:
          id: "letter-date-1y"
      - scrollUntilVisible:
          element:
            id: "seal-letter"
          direction: DOWN
          timeout: 10000
      - tapOn:
          id: "seal-letter"
      - extendedWaitUntil:
          visible:
            id: "screen-letter-sealed"
          timeout: 45000
      - tapOn:
          id: "letter-sealed-done"
      - extendedWaitUntil:
          visible:
            id: "screen-letters"
          timeout: 15000
      # Announced letter.
      - tapOn:
          id: "write-letter"
      - extendedWaitUntil:
          visible:
            id: "screen-letter-new"
          timeout: 15000
      - extendedWaitUntil:
          visible: "Test 2"
          timeout: 30000
      - tapOn:
          id: "letter-from"
      - eraseText
      - inputText: "Test 1"
      - tapOn: "Who is this for?"
      - tapOn:
          id: "letter-body"
      - inputText: "An announced letter for later."
      - tapOn: "Who is this for?"
      - scrollUntilVisible:
          element:
            id: "letter-visibility"
          direction: DOWN
          timeout: 10000
      - tapOn:
          id: "letter-visibility"
      - extendedWaitUntil:
          visible:
            id: "visibility-announced"
          timeout: 10000
      - tapOn:
          id: "visibility-announced"
      - scrollUntilVisible:
          element:
            id: "letter-date-1y"
          direction: DOWN
          timeout: 10000
      - tapOn:
          id: "letter-date-1y"
      - scrollUntilVisible:
          element:
            id: "seal-letter"
          direction: DOWN
          timeout: 10000
      - tapOn:
          id: "seal-letter"
      - extendedWaitUntil:
          visible:
            id: "screen-letter-sealed"
          timeout: 45000
      - tapOn:
          id: "letter-sealed-done"
      - extendedWaitUntil:
          visible:
            id: "screen-letters"
          timeout: 15000
      - assertVisible:
          text: "For Test 2\\. Opens .*"
      - assertVisible: "Announced"
- runFlow:
    when:
      true: ${PHASE == 'recipient_list'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - tapOn:
          id: "vault"
      - extendedWaitUntil:
          visible:
            id: "screen-vault"
          timeout: 20000
      - scrollUntilVisible:
          element:
            id: "letters-entry"
          direction: DOWN
          timeout: 15000
      - tapOn:
          id: "letters-entry"
      - extendedWaitUntil:
          visible:
            id: "screen-letters"
          timeout: 20000
      # Recipient list: announced stub title + open date (ListRow a11y includes body).
      - assertVisible:
          text: "A letter from Test 1\\. Opens .*"
      - assertVisible: "Sealed"
      # Surprise must stay invisible: no author row, no body leak, one announced only.
      - assertNotVisible: "A surprise letter they must not see yet."
      - assertNotVisible:
          text: "For Test 2.*"
      - assertNotVisible: "Surprise"
- runFlow:
    when:
      true: ${PHASE == 'recipient_stub'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - tapOn:
          id: "vault"
      - extendedWaitUntil:
          visible:
            id: "screen-vault"
          timeout: 20000
      - scrollUntilVisible:
          element:
            id: "letters-entry"
          direction: DOWN
          timeout: 15000
      - tapOn:
          id: "letters-entry"
      - extendedWaitUntil:
          visible:
            id: "screen-letters"
          timeout: 20000
      - tapOn:
          text: "A letter from Test 1.*"
      - extendedWaitUntil:
          visible:
            id: "screen-letter-detail"
          timeout: 15000
      - assertVisible: "A letter from Test 1"
      - assertVisible:
          text: "It opens .*"
      - assertNotVisible: "An announced letter for later."
      - assertNotVisible:
          id: "open-letter"
      - assertNotVisible:
          id: "letter-opened-body"
