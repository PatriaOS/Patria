# PHONE_TESTS: 13
# AREAS: rotation, membership, keys
# Pending automation: 13.1 (Updating copy), 13.5–6 (recovery seed budget), 13.7 (invite Test 3 back).
appId: app.patria.dev
---
- runFlow:
    when:
      true: ${PHASE == 'remove_member'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - runFlow:
          file: subflows/open_family.yaml
      - scrollUntilVisible:
          element:
            id: ${MEMBER_ID}
          direction: DOWN
          timeout: 20000
      - tapOn:
          id: ${MEMBER_ID}
      - tapOn:
          id: "^remove-from-this-family$"
      - tapOn:
          text: "Remove from this family"
          index: 1
      - extendedWaitUntil:
          visible: "Updating the family key"
          timeout: 20000
      - extendedWaitUntil:
          visible: "The family key is up to date"
          timeout: 30000
- runFlow:
    when:
      true: ${PHASE == 'keys_ready'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - runFlow:
          file: subflows/open_family.yaml
      - swipe:
          start: 50%, 25%
          end: 50%, 80%
      - assertVisible: "Family keys: set up on this phone"
- runFlow:
    when:
      true: ${PHASE == 'no_family'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - swipe:
          start: 50%, 25%
          end: 50%, 80%
      - assertNotVisible: ${FAMILY_NAME}
- runFlow:
    when:
      true: ${PHASE == 'needs_attention'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - assertVisible: "Recovery needs attention"
- runFlow:
    when:
      true: ${PHASE == 'leave_family'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - runFlow:
          file: subflows/open_family.yaml
      - scrollUntilVisible:
          element:
            id: "member-test-3"
          direction: DOWN
          timeout: 20000
      - tapOn:
          id: "member-test-3"
      - tapOn:
          id: "^leave-family$"
      - tapOn:
          text: "Leave family"
          index: 1
- runFlow:
    when:
      true: ${PHASE == 'change_role'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - runFlow:
          file: subflows/open_family.yaml
      - scrollUntilVisible:
          element:
            id: ${MEMBER_ID}
          direction: DOWN
          timeout: 20000
      - tapOn:
          id: ${MEMBER_ID}
      - tapOn:
          id: ${ROLE_ID}
      - tapOn:
          id: "^save-role$"
      - extendedWaitUntil:
          visible:
            id: "^home$"
          timeout: 20000
      - extendedWaitUntil:
          visible: "The family key is up to date"
          timeout: 30000
