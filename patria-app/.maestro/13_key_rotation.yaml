# PHONE_TESTS: 13
# AREAS: rotation, membership, keys
# Automated: remove → needs_attention + under_recovery (seeded contacts).
# Still skip: 13.7 invite-back Leave, 13.9 caregiver, 13.10 two-admins (not recovery/pair-box).
appId: app.patria.dev
---
- runFlow:
    when:
      true: ${PHASE == 'remove_member'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - runFlow:
          file: subflows/open_family.yaml
      - scrollUntilVisible:
          element:
            id: ${MEMBER_ID}
          direction: DOWN
          timeout: 20000
      - tapOn:
          id: ${MEMBER_ID}
      - tapOn:
          id: "^remove-from-this-family$"
      - tapOn:
          text: "Remove from this family"
          index: 1
      # Reminder sheet can cover Home after remove; dismiss then pass on settled copy.
      - runFlow:
          file: subflows/dismiss_recovery_reminder.yaml
      - tapOn:
          id: "recovery-reminder-later"
          optional: true
      - extendedWaitUntil:
          visible: "The family key is up to date"
          timeout: 45000
- runFlow:
    when:
      true: ${PHASE == 'keys_ready'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - runFlow:
          file: subflows/open_family.yaml
      - swipe:
          start: 50%, 25%
          end: 50%, 80%
      - assertVisible: "Family keys: set up on this phone"
- runFlow:
    when:
      true: ${PHASE == 'no_family'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - swipe:
          start: 50%, 25%
          end: 50%, 80%
      - assertNotVisible: ${FAMILY_NAME}
- runFlow:
    when:
      true: ${PHASE == 'needs_attention'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - runFlow:
          file: subflows/open_family.yaml
      - swipe:
          start: 50%, 30%
          end: 50%, 80%
      - scrollUntilVisible:
          element: "Recovery needs attention"
          direction: DOWN
          timeout: 30000
      - assertVisible: "Recovery needs attention"
- runFlow:
    when:
      true: ${PHASE == 'leave_family'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - runFlow:
          file: subflows/open_family.yaml
      - scrollUntilVisible:
          element:
            id: "member-test-3"
          direction: DOWN
          timeout: 20000
      - tapOn:
          id: "member-test-3"
      - tapOn:
          id: "^leave-family$"
      - tapOn:
          text: "Leave family"
          index: 1
- runFlow:
    when:
      true: ${PHASE == 'change_role'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - runFlow:
          file: subflows/open_family.yaml
      - scrollUntilVisible:
          element:
            id: ${MEMBER_ID}
          direction: DOWN
          timeout: 20000
      - tapOn:
          id: ${MEMBER_ID}
      - tapOn:
          id: ${ROLE_ID}
      - tapOn:
          id: "^save-role$"
      - extendedWaitUntil:
          visible:
            id: "^home$"
          timeout: 20000
      - extendedWaitUntil:
          visible: "The family key is up to date"
          timeout: 30000
