# PHONE_TESTS: 47
# AREAS: sync
appId: app.patria.dev
---
- runFlow:
    when:
      true: ${PHASE == 'move' || PHASE == null || PHASE == ''}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - tapOn:
          id: "sync"
      - extendedWaitUntil:
          visible:
            id: "screen-sync"
          timeout: 20000
      - scrollUntilVisible:
          element:
            id: "move-this-meeting"
          direction: DOWN
          timeout: 20000
      - tapOn:
          id: "move-this-meeting"
      - extendedWaitUntil:
          visible:
            id: "screen-sync-move"
          timeout: 15000
      # Form fields only exist once active; full Body label (Maestro textRegex is whole-string).
      - extendedWaitUntil:
          visible:
            id: "move-datetime"
          timeout: 15000
      - assertVisible: "Only this meeting moves. The usual schedule stays."
      - tapOn:
          id: "move-datetime"
      - eraseText: 40
      - inputText: ${MOVE_WHEN}
      - pressKey: Enter
      - tapOn:
          id: "move-confirm"
      - extendedWaitUntil:
          visible:
            id: "screen-sync"
          timeout: 30000
- runFlow:
    when:
      true: ${PHASE == 'series'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - tapOn:
          id: "sync"
      - extendedWaitUntil:
          visible:
            id: "screen-sync"
          timeout: 20000
      - scrollUntilVisible:
          element:
            id: "schedule"
          direction: DOWN
          timeout: 20000
      - tapOn:
          id: "schedule"
      - extendedWaitUntil:
          visible:
            id: "screen-sync-schedule"
          timeout: 15000
      - tapOn:
          id: "weekday-tue"
      - scrollUntilVisible:
          element:
            id: "save-schedule"
          direction: DOWN
          timeout: 20000
      - tapOn:
          id: "save-schedule"
      # Full Banner accessibility text (Maestro textRegex matches the whole label).
      - extendedWaitUntil:
          visible: "Your moved meeting stays as you set it. Later Syncs will follow the new schedule."
          timeout: 20000
- runFlow:
    when:
      true: ${PHASE == 'past'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - tapOn:
          id: "sync"
      - extendedWaitUntil:
          visible:
            id: "screen-sync"
          timeout: 20000
      - scrollUntilVisible:
          element:
            id: "past-meetings"
          direction: DOWN
          timeout: 20000
      - tapOn:
          id: "past-meetings"
      - extendedWaitUntil:
          visible:
            id: "screen-sync-past"
          timeout: 15000
      # Seeded finished meeting (e2e-setup); day label from formatMeetingDay in America/Chicago.
      - assertVisible: ${PAST_DAY}
      - assertVisible: "Practice together"
