# PHONE_TESTS: 10
# AREAS: devices, keys
appId: app.patria.dev
---
- runFlow:
    when:
      true: ${PHASE == 'waiting_own'}
    commands:
      - launchApp
      - runFlow:
          file: subflows/dismiss_open_in.yaml
      - runFlow:
          file: subflows/sign_in.yaml
      - assertVisible: "Waiting for one of your phones to let this one in"
- runFlow:
    when:
      true: ${PHASE == 'own_notice'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      # Device notices live on Family (Needs you only navigates there).
      - runFlow:
          file: subflows/open_family.yaml
      - scrollUntilVisible:
          element: "Is this your new phone?"
          direction: DOWN
          timeout: 30000
      - assertVisible: "Is this your new phone?"
- runFlow:
    when:
      true: ${PHASE == 'co_admin_info'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - runFlow:
          file: subflows/open_family.yaml
      - scrollUntilVisible:
          element: "added a new phone"
          direction: DOWN
          timeout: 30000
      - assertVisible: "added a new phone"
      - assertNotVisible:
          id: "yes-this-is-my-phone"
- runFlow:
    when:
      true: ${PHASE == 'approve'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - runFlow:
          file: subflows/open_family.yaml
      - scrollUntilVisible:
          element:
            id: "yes-this-is-my-phone"
          direction: DOWN
          timeout: 30000
      - tapOn:
          id: "yes-this-is-my-phone"
- runFlow:
    when:
      true: ${PHASE == 'reject'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - runFlow:
          file: subflows/open_family.yaml
      - scrollUntilVisible:
          element:
            id: "this-wasnt-me"
          direction: DOWN
          timeout: 30000
      - tapOn:
          id: "this-wasnt-me"
- runFlow:
    when:
      true: ${PHASE == 'remove_other'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - extendedWaitUntil:
          visible:
            id: "^home$"
          timeout: 20000
      - tapOn:
          text: "Cancel"
          optional: true
      - tapOn:
          text: "OK"
          optional: true
      - tapOn:
          id: "^family$"
      - extendedWaitUntil:
          visible:
            id: "screen-family"
          timeout: 20000
      # Start from the top so "Your phones" is not tucked under the header.
      - scrollUntilVisible:
          element:
            id: "family-name"
          direction: UP
          timeout: 20000
      - scrollUntilVisible:
          element:
            id: "^your-phones$"
          direction: DOWN
          timeout: 30000
          centerElement: true
      - tapOn:
          id: "^your-phones$"
      - extendedWaitUntil:
          visible:
            id: "screen-your-phones"
          timeout: 30000
      - assertVisible:
          id: "screen-your-phones"
      - assertVisible: "This phone"
      # Device B (other approved phone on this account): Set up {when} + Remove.
      - scrollUntilVisible:
          element:
            text: "Set up .*"
          direction: DOWN
          timeout: 20000
          centerElement: true
      - assertVisible:
          text: "Set up .*"
      - scrollUntilVisible:
          element:
            id: "^remove-phone$"
          direction: DOWN
          timeout: 20000
          centerElement: true
      - assertVisible:
          id: "^remove-phone$"
      - tapOn:
          id: "^remove-phone$"
      - tapOn: "Remove"
      - extendedWaitUntil:
          notVisible:
            id: "^remove-phone$"
          timeout: 30000
      - assertNotVisible:
          id: "^remove-phone$"
      - assertVisible: "This phone"
