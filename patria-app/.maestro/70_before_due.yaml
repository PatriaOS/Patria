# PHONE_TESTS: 70
# AREAS: letters
# Before due: Help is not offered, or tapping it fails (RPC refuses).
appId: app.patria.dev
---
- runFlow:
    file: subflows/sign_in.yaml
- tapOn:
    id: "vault"
- extendedWaitUntil:
    visible:
      id: "screen-vault"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "letters-entry"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "letters-entry"
- extendedWaitUntil:
    visible:
      id: "letters-keeping-title"
    timeout: 30000
- tapOn:
    id: ".*letter-keep-.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "screen-letter-keeper"
    timeout: 15000
- takeScreenshot: ../e2e-artifacts/review-captures/70-step1-keeper-before-due
- runFlow:
    when:
      visible:
        id: "keeper-help"
    commands:
      - tapOn:
          id: "keeper-help"
      # Help may append a short reason tag, e.g. (not_due) or (rpc).
      - extendedWaitUntil:
          visible: "We couldn’t help open this letter.*"
          timeout: 20000
- runFlow:
    when:
      notVisible:
        id: "keeper-help"
    commands:
      - assertNotVisible:
          id: "keeper-help"
