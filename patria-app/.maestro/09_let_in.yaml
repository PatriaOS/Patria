# PHONE_TESTS: 9
# AREAS: keys, devices, membership, invites
appId: app.patria.dev
---
- runFlow:
    when:
      true: ${PHASE == 'invite'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - runFlow:
          file: subflows/open_family.yaml
      - scrollUntilVisible:
          element:
            id: "invite-someone"
          direction: DOWN
          timeout: 10000
      - tapOn:
          id: "invite-someone"
      - tapOn:
          id: "their-email"
      - eraseText: 80
      - inputText: ${INVITE_EMAIL}
      - hideKeyboard
      - tapOn:
          id: ${ROLE_ID}
      - hideKeyboard
      - scrollUntilVisible:
          element:
            id: "create-invite"
          direction: DOWN
          timeout: 10000
      - tapOn:
          id: "create-invite"
      - hideKeyboard
      - scrollUntilVisible:
          element: "Invite is ready. Share the link, send it by email, or both."
          direction: DOWN
          timeout: 20000
      - assertVisible: "Invite is ready. Share the link, send it by email, or both."
- runFlow:
    when:
      true: ${PHASE == 'waiting'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - extendedWaitUntil:
          visible: "Waiting for a family admin to let this phone in"
          timeout: 20000
- runFlow:
    when:
      true: ${PHASE == 'let_in'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - runFlow:
          file: subflows/open_family.yaml
      - scrollUntilVisible:
          element:
            id: "let-in-notice"
          direction: DOWN
          timeout: 15000
      - assertVisible:
          id: "let-in-notice"
          text: ".*added a new phone.*"
      - tapOn:
          id: "^let-in$"
      - extendedWaitUntil:
          notVisible: "added a new phone"
          timeout: 20000
- runFlow:
    when:
      true: ${PHASE == 'keys_ready'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - runFlow:
          file: subflows/open_family.yaml
      - extendedWaitUntil:
          visible: "Family keys: set up on this phone"
          timeout: 20000
- runFlow:
    when:
      true: ${PHASE == 'no_notice'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - runFlow:
          file: subflows/open_family.yaml
      - assertNotVisible: "added a new phone"
- runFlow:
    when:
      true: ${PHASE == 'decline'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - runFlow:
          file: subflows/open_family.yaml
      - assertVisible:
          id: "let-in-notice"
          text: ".*added a new phone.*"
      - tapOn:
          id: "decline"
      - assertNotVisible: "Let in"
