# PHONE_TESTS: 38
# AREAS: sync
# Needs a Sync schedule plus Win and Decide agenda items (e2e-setup).
appId: app.patria.dev
---
- runFlow:
    file: subflows/sign_in.yaml
- tapOn:
    id: "sync"
- extendedWaitUntil:
    visible:
      id: "screen-sync"
    timeout: 20000
- runFlow:
    when:
      visible:
        id: "hold-it-now"
    commands:
      - tapOn:
          id: "hold-it-now"
- runFlow:
    when:
      visible:
        id: "continue"
    commands:
      - tapOn:
          id: "continue"
- extendedWaitUntil:
    visible:
      id: "screen-sync-run"
    timeout: 20000
- assertVisible: "Wins"
- runFlow:
    when:
      visible: "Mark discussed"
    commands:
      - tapOn: "Mark discussed"
- tapOn:
    id: "next"
- assertVisible: "Look ahead"
- tapOn:
    id: "next"
- assertVisible: "Decide"
- runFlow:
    when:
      visible: "Mark discussed"
    commands:
      - tapOn:
          id: "what-did-we-decide"
          optional: true
      - inputText: "We will share the drive"
      - hideKeyboard
      - tapOn: "Mark discussed"
- tapOn:
    id: "next"
- assertVisible: "Gratitude"
- tapOn:
    id: "next"
- assertVisible: "One priority for the week"
- tapOn:
    id: "one-priority-for-the-week"
- inputText: "Get everyone to practice"
- hideKeyboard
- tapOn:
    id: "task"
- inputText: "Pack kit bags"
- hideKeyboard
- tapOn:
    id: "add-a-task"
- scrollUntilVisible:
    element:
      id: "finish-the-sync"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "finish-the-sync"
- extendedWaitUntil:
    visible:
      id: "screen-sync"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "tasks"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "tasks"
- extendedWaitUntil:
    visible:
      id: "screen-sync-tasks"
    timeout: 15000
- assertVisible: "Pack kit bags"
