# PHONE_TESTS: 11
# AREAS: recovery, keys
# Printed words: copy to clipboard only. Never screenshot this flow on the words screen.
# Step 8: Elder Test 2 chooses Test 1 using the same phases.
appId: app.patria.dev
---
- runFlow:
    when:
      true: ${PHASE == 'open_card'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - assertVisible: "Set up recovery"
      - tapOn:
          id: "choose-recovery-contacts"
      - assertVisible: "Recovery contacts"
- runFlow:
    when:
      true: ${PHASE == 'pick_contact'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - tapOn:
          id: "choose-recovery-contacts"
          optional: true
      - scrollUntilVisible:
          element:
            id: ${CONTACT_ID}
          direction: DOWN
          timeout: 20000
      - tapOn:
          id: ${CONTACT_ID}
      - tapOn:
          id: "ask-these-people"
- runFlow:
    when:
      true: ${PHASE == 'accept_contact'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - swipe:
          start: 50%, 25%
          end: 50%, 80%
      - assertVisible: "Will you help with recovery?"
      - tapOn:
          id: "accept"
- runFlow:
    when:
      true: ${PHASE == 'setup_done'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - assertVisible: "Recovery: set up"
- runFlow:
    when:
      true: ${PHASE == 'printed_code'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - runFlow:
          when:
            notVisible:
              id: "^create-printed-code$"
          commands:
            - scrollUntilVisible:
                element:
                  id: "^recovery-contacts$"
                direction: DOWN
                timeout: 10000
            - tapOn:
                id: "^recovery-contacts$"
      - scrollUntilVisible:
          element:
            id: "^create-printed-code$"
          direction: DOWN
          timeout: 20000
      - tapOn:
          id: "^create-printed-code$"
      - extendedWaitUntil:
          visible:
            id: "printed-code-words"
          timeout: 20000
      - copyTextFrom:
          id: "printed-code-words"
      - tapOn:
          id: "i-have-written-them-down"
      - tapOn:
          id: "skip-for-now"
          optional: true
- runFlow:
    when:
      true: ${PHASE == 'remove_contact'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - tapOn:
          id: "choose-recovery-contacts"
          optional: true
      - runFlow:
          when:
            notVisible:
              id: "remove-as-recovery-contact"
          commands:
            - runFlow:
                file: subflows/open_family.yaml
            - scrollUntilVisible:
                element:
                  id: "recovery-contacts"
                direction: DOWN
                timeout: 10000
            - tapOn:
                id: "recovery-contacts"
      - extendedWaitUntil:
          visible:
            id: "remove-as-recovery-contact"
          timeout: 20000
      - tapOn:
          id: "remove-as-recovery-contact"
      - tapOn:
          point: 8%, 12%
      - tapOn:
          id: "home"
      - extendedWaitUntil:
          visible:
            id: "^home$"
          timeout: 15000
      - swipe:
          start: 50%, 25%
          end: 50%, 80%
      - assertVisible: "Recovery needs attention"
