# PHONE_TESTS: 11
# AREAS: recovery, keys
# Printed words: copy to clipboard only. Never screenshot this flow on the words screen.
# Step 8: Elder Test 2 chooses Test 1 using the same phases.
appId: app.patria.dev
---
- runFlow:
    when:
      true: ${PHASE == 'open_card'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - tapOn:
          id: "home-needs-you-bell"
      - extendedWaitUntil:
          visible:
            id: "screen-needs-you"
          timeout: 15000
      - assertVisible:
          id: "needs-you-recovery-setup"
      - tapOn:
          id: "needs-you-recovery-setup"
      - extendedWaitUntil:
          visible:
            id: "screen-privacy-security"
          timeout: 15000
      - tapOn:
          id: "privacy-recovery-contacts"
      - assertVisible: "Recovery contacts"
- runFlow:
    when:
      true: ${PHASE == 'pick_contact'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - runFlow:
          when:
            notVisible: "Ask these people"
          commands:
            - tapOn:
                id: "home-needs-you-bell"
                optional: true
            # Mid-setup (one contact) uses recovery-setup; broken Finish-setup uses attention.
            - tapOn:
                id: "needs-you-recovery-setup"
                optional: true
            - tapOn:
                id: "needs-you-recovery-attention"
                optional: true
            - tapOn:
                id: "privacy-recovery-contacts"
                optional: true
            - tapOn:
                id: "home-menu"
                optional: true
            - tapOn:
                id: "menu-privacy-security"
                optional: true
            - tapOn:
                id: "privacy-recovery-contacts"
                optional: true
      - scrollUntilVisible:
          element:
            id: ${CONTACT_ID}
          direction: DOWN
          timeout: 20000
      - tapOn:
          id: ${CONTACT_ID}
      - tapOn:
          id: "ask-these-people"
- runFlow:
    when:
      true: ${PHASE == 'accept_contact'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - runFlow:
          file: subflows/open_family.yaml
      - swipe:
          start: 50%, 25%
          end: 50%, 80%
      - assertVisible: "Will you help with recovery?"
      - tapOn:
          id: "accept"
# After first contact accepts — Family shows Recovery: 1 of 2 contacts.
- runFlow:
    when:
      true: ${PHASE == 'one_of_two'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - runFlow:
          file: subflows/open_family.yaml
      - swipe:
          start: 50%, 30%
          end: 50%, 80%
      - scrollUntilVisible:
          element: "Recovery: 1 of 2 contacts"
          direction: DOWN
          timeout: 30000
      - assertVisible: "Recovery: 1 of 2 contacts"
      - takeScreenshot: recovery-one-of-two
- runFlow:
    when:
      true: ${PHASE == 'almost_done'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - runFlow:
          file: subflows/open_family.yaml
      # Member list can push the status card above the fold after two accepts.
      - swipe:
          start: 50%, 30%
          end: 50%, 80%
      - scrollUntilVisible:
          element: "Almost done: write down your printed code"
          direction: DOWN
          timeout: 30000
      - assertVisible: "Almost done: write down your printed code"
      - takeScreenshot: recovery-almost-done
- runFlow:
    when:
      true: ${PHASE == 'finish_setup_card'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - tapOn:
          id: "home-menu"
          optional: true
      - tapOn:
          id: "menu-privacy-security"
          optional: true
      - tapOn:
          id: "privacy-recovery-contacts"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "finish-recovery-setup"
          timeout: 20000
      - assertVisible: "Recovery needs attention"
      - assertVisible: "Finish setup"
      - takeScreenshot: recovery-finish-setup
- runFlow:
    when:
      true: ${PHASE == 'setup_done'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - runFlow:
          file: subflows/open_family.yaml
      - assertVisible: "Recovery: set up"
- runFlow:
    when:
      true: ${PHASE == 'printed_code'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - tapOn:
          id: "home-menu"
      - extendedWaitUntil:
          visible:
            id: "menu-privacy-security"
          timeout: 10000
      - tapOn:
          id: "menu-privacy-security"
      - extendedWaitUntil:
          visible:
            id: "screen-privacy-security"
          timeout: 15000
      - scrollUntilVisible:
          element:
            id: "^create-printed-code$"
          direction: DOWN
          timeout: 20000
      - tapOn:
          id: "^create-printed-code$"
      - extendedWaitUntil:
          visible:
            id: "printed-code-words"
          timeout: 20000
      - extendedWaitUntil:
          visible:
            id: "printed-code-continue"
          timeout: 10000
      # Capture the green continue button; crop words out of the file after (never log words).
      - takeScreenshot: recovery-printed-continue
      - copyTextFrom:
          id: "printed-code-words"
      # E2E skip saves ap/bp without typing confirm words (never logs the code).
      - tapOn:
          id: "printed-code-skip"
# Review capture only: open printed words via "I lost the printed code" and shot the continue button.
- runFlow:
    when:
      true: ${PHASE == 'printed_continue_shot'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - tapOn:
          id: "home-menu"
      - extendedWaitUntil:
          visible:
            id: "menu-privacy-security"
          timeout: 10000
      - tapOn:
          id: "menu-privacy-security"
      - extendedWaitUntil:
          visible:
            id: "screen-privacy-security"
          timeout: 15000
      - tapOn:
          id: "privacy-recovery-contacts"
          optional: true
      - scrollUntilVisible:
          element: "I lost the printed code"
          direction: DOWN
          timeout: 20000
      - tapOn: "I lost the printed code"
      - extendedWaitUntil:
          visible:
            id: "printed-code-continue"
          timeout: 20000
      - takeScreenshot: recovery-printed-continue
- runFlow:
    when:
      true: ${PHASE == 'remove_contact'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - runFlow:
          file: subflows/open_family.yaml
      - scrollUntilVisible:
          element:
            id: "recovery-contacts"
          direction: DOWN
          timeout: 20000
      - tapOn:
          id: "recovery-contacts"
      - extendedWaitUntil:
          visible:
            id: ${REMOVE_CONTACT_ID}
          timeout: 20000
      - tapOn:
          id: ${REMOVE_CONTACT_ID}
      - tapOn:
          point: 8%, 12%
      - runFlow:
          file: subflows/open_family.yaml
      - swipe:
          start: 50%, 30%
          end: 50%, 80%
      - scrollUntilVisible:
          element: "Recovery needs attention"
          direction: DOWN
          timeout: 30000
      - assertVisible: "Recovery needs attention"
      - takeScreenshot: recovery-needs-attention
- runFlow:
    when:
      true: ${PHASE == 'finish_setup'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - runFlow:
          file: subflows/open_family.yaml
      - scrollUntilVisible:
          element:
            id: "recovery-contacts"
          direction: DOWN
          timeout: 20000
      - tapOn:
          id: "recovery-contacts"
      - extendedWaitUntil:
          visible:
            id: "finish-recovery-setup"
          timeout: 20000
      - assertVisible: "Recovery needs attention"
      - tapOn:
          id: "finish-recovery-setup"
      # Finish setup often pushes Printed code. Skip saves ap/bp (seed already has helpers).
      - runFlow:
          when:
            visible:
              id: "printed-code-skip"
          commands:
            - tapOn:
                id: "printed-code-skip"
      - runFlow:
          when:
            notVisible:
              id: "^family$"
          commands:
            - tapOn:
                point: 8%, 12%
      - runFlow:
          file: subflows/open_family.yaml
      - swipe:
          start: 50%, 30%
          end: 50%, 80%
      - scrollUntilVisible:
          element:
            id: "recovery-contacts"
          direction: DOWN
          timeout: 30000
      - assertVisible:
          id: "recovery-contacts"
      # Pass if either Almost done (ab only) or set up (skip completed paper).
      - runFlow:
          when:
            visible: "Almost done: write down your printed code"
          commands:
            - assertVisible: "Almost done: write down your printed code"
      - runFlow:
          when:
            visible: "Recovery: set up"
          commands:
            - assertVisible: "Recovery: set up"
- runFlow:
    when:
      true: ${PHASE == 'helper_refreshed'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - runFlow:
          file: subflows/open_family.yaml
      - swipe:
          start: 50%, 25%
          end: 50%, 80%
      - scrollUntilVisible:
          element:
            id: "recovery-helper-refreshed"
          direction: DOWN
          timeout: 30000
      - assertVisible:
          id: "recovery-helper-refreshed"
      - takeScreenshot: recovery-helper-refreshed
