# PHONE_TESTS: 64
# AREAS: letters
# Author changes open day while sealed; seal code unchanged.
appId: app.patria.dev
---
- runFlow:
    file: subflows/sign_in.yaml
- tapOn:
    id: "vault"
- extendedWaitUntil:
    visible:
      id: "screen-vault"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "letters-entry"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "letters-entry"
- extendedWaitUntil:
    visible:
      id: "screen-letters"
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "write-letter"
    timeout: 30000
- tapOn:
    id: "write-letter"
- extendedWaitUntil:
    visible:
      id: "screen-letter-new"
    timeout: 15000
- extendedWaitUntil:
    visible: "Test 2"
    timeout: 30000
- tapOn:
    id: "letter-from"
- eraseText
- inputText: "Test 1"
- tapOn: "Who is this for?"
- tapOn:
    id: "letter-body"
- inputText: "Change the open day only."
- tapOn: "Who is this for?"
- scrollUntilVisible:
    element:
      id: "letter-date-1y"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "letter-date-1y"
- scrollUntilVisible:
    element:
      id: "seal-letter"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "seal-letter"
- extendedWaitUntil:
    visible:
      id: "screen-letter-sealed"
    timeout: 45000
- extendedWaitUntil:
    visible:
      id: "letter-seal-code"
    timeout: 10000
- tapOn:
    id: "letter-sealed-done"
- extendedWaitUntil:
    visible:
      id: "screen-letters"
    timeout: 15000
- tapOn:
    text: "For Test 2.*"
- extendedWaitUntil:
    visible:
      id: "change-open-date"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "letter-open-day"
    timeout: 10000
- copyTextFrom:
    id: "letter-open-day"
- evalScript: ${output.openDayBefore = maestro.copiedText}
- takeScreenshot: b0-letter-detail-change-open-date
- tapOn:
    id: "change-open-date"
- extendedWaitUntil:
    visible:
      id: "change-open-date-sheet"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "change-open-date-preview"
    timeout: 10000
# Preview label must match the wheel (family open day); save with no change keeps it.
- assertVisible:
    id: "change-open-date-preview"
- takeScreenshot: b0-change-open-date-sheet
- tapOn:
    id: "change-open-date-save"
- extendedWaitUntil:
    visible:
      id: "change-open-date"
    timeout: 20000
- assertVisible:
    id: "change-open-date"
- copyTextFrom:
    id: "letter-open-day"
- assertTrue: ${maestro.copiedText == output.openDayBefore}
- takeScreenshot: b0-letter-detail-after-date-change
