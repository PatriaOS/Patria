# PHONE_TESTS: 8
# AREAS: keys
appId: app.patria.dev
---
- runFlow:
    when:
      true: ${PHASE == 'create_family'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - runFlow:
          file: subflows/open_family.yaml
      - tapOn:
          id: "create-another-family"
          optional: true
      - tapOn:
          id: "family-space-name"
      - eraseText
      - inputText: ${FAMILY_NAME}
      - tapOn:
          id: "create-our-family"
      - tapOn:
          id: "take-me-home"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "^home$|recovery-reminder-later"
          timeout: 30000
      - runFlow:
          file: subflows/dismiss_recovery_reminder.yaml
      - extendedWaitUntil:
          visible:
            id: "^home$"
          timeout: 15000
      - runFlow:
          file: subflows/open_family.yaml
      - scrollUntilVisible:
          element:
            id: "family-keys-status"
          direction: DOWN
          timeout: 30000
      - assertVisible: "Family keys: set up on this phone"
- runFlow:
    when:
      true: ${PHASE == 'switch_older'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - runFlow:
          file: subflows/open_family.yaml
      - tapOn:
          id: ${OLDER_FAMILY_ID}
      - assertVisible: "Family keys: set up on this phone"
- runFlow:
    when:
      true: ${PHASE == 'member_waiting'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - assertVisible: "Waiting for a family admin to let this phone in"
- runFlow:
    when:
      true: ${PHASE == 'home_keys'}
    commands:
      - runFlow:
          file: subflows/sign_in.yaml
      - runFlow:
          file: subflows/open_family.yaml
      - scrollUntilVisible:
          element:
            id: "family-keys-status"
          direction: DOWN
          timeout: 30000
      - assertVisible: "Family keys: set up on this phone"
- runFlow:
    when:
      true: ${PHASE == 'reopen'}
    commands:
      - stopApp
      - launchApp
      # After a prior dismiss this sign-in, cold start must not show the sheet.
      # (First launch after wipe may still show it once — dismiss, then prove keys.)
      - extendedWaitUntil:
          visible:
            id: "home-greeting|recovery-reminder-later"
          timeout: 30000
      - runFlow:
          file: subflows/dismiss_recovery_reminder.yaml
      - extendedWaitUntil:
          visible:
            id: "home-greeting"
          timeout: 15000
      - assertNotVisible:
          id: "recovery-reminder-sheet"
      - runFlow:
          file: subflows/open_family.yaml
      # Let-in notices push keys status below the fold — scroll, do not loosen.
      - scrollUntilVisible:
          element:
            id: "family-keys-status"
          direction: DOWN
          timeout: 30000
      - assertVisible: "Family keys: set up on this phone"
